<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Photo Sphere Viewer</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/core@5/index.css">
  <style>
    html, body, #viewer {
      width: 100%;
      height: 100%;
      margin: 0;
      font-family: sans-serif;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three/build/three.module.js",
        "@photo-sphere-viewer/core": "https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/core@5/index.module.js"
      }
    }
  </script>
</head>
<body>
  <div id="viewer"></div>
  <script type="module">
    import { Viewer } from '@photo-sphere-viewer/core';

    new Viewer({
      container: 'viewer',
      panorama: 'https://i.ibb.co/vCpLq95V/DJI-0129.jpg',
  "defaultZoomLvl": 100,
  "minFov": 25,
  "maxFov": 145,
  "fisheye": true,
  "moveInertia": true,
  "navbar": [
    "zoom",
    "move",
    "fullscreen"
  ],
    });
  </script>
</body>
</html>
